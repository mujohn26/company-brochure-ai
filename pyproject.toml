[project]
name = "company-brochure-ai"
version = "0.1.0"
description = "Turn any company website into a marketing brochure with LLMs"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "beautifulsoup4>=4.12",
    "gradio>=5.0",
    "openai>=1.40",
    "python-dotenv>=1.0",
    "requests>=2.31",
    "selenium>=4.20",
]

[project.scripts]
company-brochure-ai = "company_brochure_ai.app:main"

[dependency-groups]
dev = ["ipykernel>=6.29"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/company_brochure_ai"]